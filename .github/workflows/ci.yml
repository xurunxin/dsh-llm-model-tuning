name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The plugin runs inside DSH on Node 20+; both ends of the supported
        # range are exercised so a language-level change cannot slip through.
        node: [20, 22]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # Nothing to install: the plugin, its suites, and the browser bundle use
      # only Node builtins and the browser module table's baseline. The
      # manifest checks live in the test suite rather than duplicating here.
      - name: Syntax check
        run: |
          node --check lib/index.js
          node --check lib/client.js
          for file in test/*.mjs; do node --check "$file"; done

      - name: Test
        run: npm test
